name: LC proxy synthetic regression tests

on:
  push:
    branches: [lc-infraslow-3ABD]
  pull_request:

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: env/PYTHON_VERSION
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r env/requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q analysis
      - run: python analysis/test_corrected_estimators.py
        env:
          MPLCONFIGDIR: /tmp/matplotlib
      - run: python analysis/test_lecci_faithful.py
        env:
          MPLCONFIGDIR: /tmp/matplotlib
      - run: python analysis/test_spectral_gapped.py
      - run: python analysis/test_overlap_aggregate.py
      - run: python analysis/test_qc_profiles.py
      - run: python analysis/test_event_3d_cache_support.py
        env:
          MPLCONFIGDIR: /tmp/matplotlib
      - run: python analysis/test_calibrate_staging_windows.py
        env:
          MPLCONFIGDIR: /tmp/matplotlib
      - run: python analysis/test_3B_null.py
      - run: python analysis/test_coherence_calibration.py
        env:
          MPLCONFIGDIR: /tmp/matplotlib
      - run: python analysis/test_run_integrity.py
      - run: python analysis/test_cache_producer_integrity.py
      - run: python analysis/test_manifest_contract.py
      - run: python analysis/test_compare_qc_rebuilds.py
      - run: python analysis/test_public_artifacts.py
      - run: python analysis/test_paired_artifact_contracts.py
      - run: python analysis/test_paired_reporting.py
        env:
          MPLCONFIGDIR: /tmp/matplotlib
      # A clean CI checkout has no private EEG-derived NPZ caches.  Offline
      # mode still requires and byte-validates every checked-in result,
      # inventory, source pin, and frozen QC-grid artifact.
      - run: python analysis/test_paired_scalp.py --artifact-validation offline
        env:
          MPLCONFIGDIR: /tmp/matplotlib
      - run: python analysis/audit_issue_evidence.py
